# Builds the APK with the official Android SDK and Gradle on every push.
# Download it from the run page in the Actions tab ("XTract-apk" artifact).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest            # the Android SDK comes preinstalled
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Sets ANDROID_HOME and accepts SDK licences. Its default package list includes the
      # retired "tools" package, which makes sdkmanager fail, so name the real ones.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: XTract-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

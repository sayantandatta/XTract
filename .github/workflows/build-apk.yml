# Builds the APK with the official Android SDK and Gradle on every push.
# Download it from the run page in the Actions tab ("XTract-apk" artifact).
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest            # the Android SDK comes preinstalled
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3   # sets ANDROID_HOME and accepts SDK licences

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: XTract-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
